<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    เส้นทางฐานของแอป · flutter build จะแทนที่ค่านี้ด้วย --base-href
    ปล่อยเป็น "/" ตามเดิมเมื่อ deploy ที่รากโดเมนอย่างบน Vercel
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ระบบจัดการหอพัก — ออกบิลค่าเช่า ค่าน้ำค่าไฟ รับชำระผ่านพร้อมเพย์ และคุยกับผู้เช่าในที่เดียว">
  <meta name="theme-color" content="#1B3A5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HorPlug">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HorPlug — ระบบจัดการหอพัก</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* พื้นหลังสีเดียวกับธีมของแอป · ระหว่างที่ยังโหลด engine ไม่เสร็จ ผู้ใช้จะ
       เห็นสีนี้แทนหน้าขาวที่กระพริบเป็นสีขาวแล้วตัดเป็นสีเข้ม */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F5F7FA;
      /* กันการลากหน้าเว็บทั้งหน้าบน iOS Safari ซึ่งทำให้เนื้อหาเด้งพ้นจอ
         ระหว่างที่ผู้ใช้เลื่อนรายการภายในแอป */
      overscroll-behavior: none;
    }

    /* ตัวบอกสถานะระหว่างโหลด · Flutter จะเขียนทับ body ทั้งหมดเมื่อพร้อม
       จึงไม่ต้องลบเอง */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #5A6B80;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">กำลังโหลด…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
