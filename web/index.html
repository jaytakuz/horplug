<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    เส้นทางฐานของแอป · flutter build จะแทนที่ค่านี้ด้วย --base-href
    ปล่อยเป็น "/" ตามเดิมเมื่อ deploy ที่รากโดเมนอย่างบน Vercel
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ระบบจัดการหอพัก — ออกบิลค่าเช่า ค่าน้ำค่าไฟ รับชำระผ่านพร้อมเพย์ และคุยกับผู้เช่าในที่เดียว">
  <meta name="theme-color" content="#1B3A5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HorPlug">
  <!--
    ไอคอนของ iOS ต้องเป็นไฟล์แยก ไม่ใช่ Icon-192 ที่ใช้กับ PWA — สองอย่างนี้
    ต่างกันสองข้อ · iOS ไม่รองรับ alpha มุมโค้งที่โปร่งจะกลายเป็นสีดำรอบไอคอน
    บนหน้าจอโฮม ไฟล์นี้จึงแบนพื้นครีมของตัวโลโก้ลงไปแล้ว · และขนาดมาตรฐานคือ
    180 ไม่ใช่ 192 ซึ่งถ้าส่งผิดขนาด iOS จะย่อเอง แล้วได้ขอบฟุ้ง
  -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!--
    Favicon สามขนาด ไม่ใช่ขนาดเดียว — เบราว์เซอร์เลือกไฟล์ที่ตรงกับที่ต้องใช้
    แทนที่จะย่อไฟล์เดียวลงมาเอง ซึ่งได้ขอบฟุ้งบนแท็บที่กว้างแค่ 16px
    ทุกไฟล์ถูกเรนเดอร์จากต้นฉบับ 4000px ผ่าน scripts/generate_web_icons.py
  -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>

  <title>HorPlug — ระบบจัดการหอพัก</title>
  <link rel="manifest" href="manifest.json">

  <!--
    โหลดฟอนต์หลักไปพร้อมกับ engine ไม่ใช่หลังจากนั้น · ไม่มีสองบรรทัดนี้
    ตัวหนังสือชุดแรกจะขึ้นด้วยฟอนต์ของระบบแล้วกระโดดเปลี่ยนเมื่อไฟล์จริงมาถึง

    เส้นทางมี lib/ ซ้อนอยู่จริงๆ — Flutter คัดลอก asset ตามพาธที่ประกาศใน
    pubspec.yaml ทั้งดุ้น ไว้ใต้ assets/ อีกที
  -->
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/lib/assets/fonts/OpenSans-Regular.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/lib/assets/fonts/GoogleSansThai-Regular.ttf">

  <style>
    /* ไฟล์เดียวกับที่ preload ไว้ด้านบน — URL ต้องตรงกันทุกตัวอักษร ไม่งั้น
       เบราว์เซอร์จะโหลดซ้ำอีกรอบแทนที่จะหยิบจาก preload
       unicode-range จำกัดให้ใช้กับตัวไทยเท่านั้น (ไฟล์นี้ตัดมาแค่บล็อกไทย) */
    @font-face {
      font-family: "Google Sans";
      src: url("assets/lib/assets/fonts/GoogleSansThai-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
      unicode-range: U+0E00-0E7F, U+200B-200D, U+25CC;
    }

    /* สีกรมท่าเดียวกับ AppColors.primary และ theme-color ด้านบน · Safari บน
       iOS รุ่นใหม่ไม่อ่าน theme-color แล้ว แต่ย้อมแถบสถานะ (เวลา แบตเตอรี่)
       ตามสีพื้นหลังของหน้าแทน ถ้าปล่อยเป็นสีเทาอ่อน แถบบน iPhone จะไม่ตรงกับ
       Android · Flutter วาดทับพื้นหลังนี้ทั้งจอ จึงเห็นสีนี้แค่ใต้แถบสถานะและ
       ระหว่างที่ engine ยังโหลดไม่เสร็จ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1B3A5C;
      /* กันการลากหน้าเว็บทั้งหน้าบน iOS Safari ซึ่งทำให้เนื้อหาเด้งพ้นจอ
         ระหว่างที่ผู้ใช้เลื่อนรายการภายในแอป */
      overscroll-behavior: none;
    }

    /* ตัวบอกสถานะระหว่างโหลด · Flutter จะเขียนทับ body ทั้งหมดเมื่อพร้อม
       จึงไม่ต้องลบเอง */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      /* ตัวไทยใช้ Google Sans ให้ตรงกับแอป · font-display: swap ทำให้ข้อความ
         ขึ้นด้วยฟอนต์ระบบก่อนระหว่างรอไฟล์ แล้วค่อยสลับ แทนที่จะว่างเปล่า
         ส่วนตัวที่ไม่ใช่ไทย (…) ตกไปฟอนต์ระบบตามเดิม */
      font-family: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">กำลังโหลด…</div>
  <!--
    Flutter บนเว็บไม่อ่าน env(safe-area-inset-*) · MediaQuery.viewPadding จึง
    เป็น 0 เสมอ แถบเมนูล่างเลยไปชิดแถบ home indicator ของ iPhone · วัดค่าจริง
    ด้วย element ตัวอย่างแล้วเปิดให้ Dart อ่านผ่าน window.horplugSafeAreaBottom
    (ดู lib/widgets/web_safe_area.dart) · วัดใหม่ทุกครั้งที่ถูกเรียก เพราะค่า
    เปลี่ยนเมื่อหมุนจอหรือแถบเครื่องมือของ Safari ยุบ/ขยาย
  -->
  <script>
    window.horplugSafeAreaBottom = function () {
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
        'height:0;padding-bottom:env(safe-area-inset-bottom, 0px);';
      document.body.appendChild(probe);
      var value = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      return value;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
