name: horplug
description: "แอปจัดการหอพักและประสบการณ์ของผู้เช่าในที่เดียว"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # usePathUrlStrategy() ใน main.dart — URL บนเว็บไม่มี # นำหน้า ซึ่งจำเป็นเพราะ
  # ลิงก์รีเซ็ตรหัสผ่านของ Supabase ส่ง token มาใน fragment · แพ็กเกจนี้มากับ
  # Flutter SDK อยู่แล้ว แค่ต้องประกาศเพราะ import ตรงๆ
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  go_router: ^14.0.0
  supabase_flutter: ^2.12.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.0
  promptpay_qrcode_generate: ^1.0.2
  # ใช้ตรงๆ ใน widgets/promptpay_qr.dart เพื่อวาด QR จาก payload ที่ซ่อมแล้ว
  # แทนที่จะใช้ widget ของ promptpay_qrcode_generate ซึ่งวาดจาก payload ที่ยัง
  # ไม่ได้ซ่อม · ประกาศเป็น direct dependency เพราะพึ่งพาโดยตรง ไม่ใช่ผ่านตัวอื่น
  qr_flutter: ^4.1.0
  # เก็บลำดับทางลัดที่ผู้เช่าจัดเอง · เคยอยู่ใต้ dev_dependencies ซึ่งใช้ได้ตอน
  # รันเทสต์แต่ไม่ถูกรวมเข้าแอปจริง
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # โลโก้ย่อสำหรับใช้ใน UI · ไอคอนต้นฉบับ 4000×4000 ไม่ได้ประกาศไว้เพราะ
    # หนัก 13MB และใช้เป็น app icon ผ่านระบบของแต่ละแพลตฟอร์มอยู่แล้ว
    - lib/assets/horplug_logo.png
    # ประกาศเป็น asset ไม่ใช่ fonts: เพราะแพ็กเกจ pdf โหลดฟอนต์ผ่าน rootBundle
    # เอง ไม่ได้ใช้ระบบฟอนต์ของ Flutter
    - lib/assets/fonts/Sarabun-Regular.ttf
    - lib/assets/fonts/Sarabun-Bold.ttf
    # ใบอนุญาตของฟอนต์ที่ฝังมา · main() อ่านผ่าน rootBundle แล้วลงทะเบียนกับ
    # LicenseRegistry เพื่อให้โผล่ในหน้า licenses ของแอปตามที่ OFL กำหนด
    - lib/assets/fonts/OFL-OpenSans.txt
    - lib/assets/fonts/OFL-NotoSansThai.txt

  # คนละที่กับ assets: ด้านบนโดยตั้งใจ — ที่นี่คือฟอนต์ที่ระบบฟอนต์ของ Flutter
  # ต้องรู้จักชื่อตระกูลและน้ำหนัก เพื่อให้ธีมอ้างถึงด้วย fontFamily ได้
  #
  # Open Sans ไม่มีอักษรไทยสักตัว (latin/greek/cyrillic/hebrew เท่านั้น) จึงต้อง
  # มี Noto Sans Thai คู่มาเสมอ ดู fontFamilyFallback ใน theme/app_theme.dart
  fonts:
    - family: Open Sans
      fonts:
        - asset: lib/assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Noto Sans Thai
      fonts:
        - asset: lib/assets/fonts/NotoSansThai-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
